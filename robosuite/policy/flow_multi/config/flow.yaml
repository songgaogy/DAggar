flow:
  image_encoder:
    type: "shared_resnet18_spatial_softmax"
    feature_dim: 256
    pretrained_path: "/home/dodo/Documents/DAggar/robosuite/robosuite/RL/models/resnet18-f37072fd.pth"
    freeze_backbone: true
    trainable_stages: ["layer3","layer4"]
    train_token_projections: true
    include_spatial_softmax: true
    layer3_pool_size: 2
    layer4_pool_size: 2

  proprio_encoder:
    type: "mlp"
    hidden_dim: 256
    num_tokens: 2

  language_encoder:
    type: "clip_text"
    pretrained_name: "/home/dodo/Documents/DAggar/robosuite/data/pretrained/clip-vit-base-patch32"
    max_length: 77
    freeze_backbone: true
    local_files_only: true

  modulation:
    type: "film"
    hidden_dim: 512

    # FiLM on visual and proprio by language
    modulate_visual: true
    modulate_proprio: false

  fusion:
    type: "transformer"
    feature_dim: 256
    max_language_tokens: 77
    num_heads: 8
    depth: 3
    dropout: 0.1
    use_language_adaln: false   # for LanguageConditionedLayerNorm()

  aggregator:
    type: "attention_pool"
    hidden_dim: 512
    output_dim: 256

  head:
    type: "unet_1d"
    hidden_dim: 128
    time_dim: 128
    cond_dim: 256
    channel_mults: [1, 2, 2, 2]
    dropout: 0.05
    cross_attention:
      enabled: true
      attn_dim: 256
      num_heads: 4
      dropout: 0.05
      mid: true
      down_layers: []
      up_layers: [0, 1]
    action_step_embedding:
      enabled: true
      embedding_dim: 64
