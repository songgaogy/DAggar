hydra:
  run:
    dir: outputs/lpb_dice_visualize/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 42

save_dir: "./checkpoints/multitask_6/lpb_dice/visualize"

policy:
  ckpt: "./checkpoints/multitask_6/policy/flow-20/flow_multi_ep0100_20260320_114720.pt"
  device: "cuda"
  encoder_batch_size: 96

data:
  image_size: 128
  transition_horizon: 1
  cache_dir: "./data/.lpb_new_cache"
  encode_demo_batch_size: 8
  splits:
    train: {num_expert_traj: 180, num_success_traj: 180, num_fail_traj: 180}
    eval: {num_expert_traj: 20, num_success_traj: 20, num_fail_traj: 20}
  tasks:
    PandaLift:
      expert_dir: "./data/PandaLift/expert"
      success_rollout_dir: "./data/PandaLift/success_rollout"
      fail_rollout_dir: "./data/PandaLift/fail_rollout"
      train: {num_expert_traj: 180, num_success_traj: 180, num_fail_traj: 0}
      eval: {num_expert_traj: 20, num_success_traj: 20, num_fail_traj: 0}
    PandaPickPlaceCan:
      expert_dir: "./data/PandaPickPlaceCan/expert"
      success_rollout_dir: "./data/PandaPickPlaceCan/success_rollout"
      fail_rollout_dir: "./data/PandaPickPlaceCan/fail_rollout"
      train: {num_expert_traj: 180, num_success_traj: 180, num_fail_traj: 180}
      eval: {num_expert_traj: 20, num_success_traj: 20, num_fail_traj: 20}
    PandaStack:
      expert_dir: "./data/PandaStack/expert"
      success_rollout_dir: "./data/PandaStack/success_rollout"
      fail_rollout_dir: "./data/PandaStack/fail_rollout"
      train: {num_expert_traj: 180, num_success_traj: 180, num_fail_traj: 180}
      eval: {num_expert_traj: 20, num_success_traj: 20, num_fail_traj: 20}
    PickPlaceBread:
      expert_dir: "./data/PickPlaceBread/expert"
      success_rollout_dir: "./data/PickPlaceBread/success_rollout"
      fail_rollout_dir: "./data/PickPlaceBread/fail_rollout"
      train: {num_expert_traj: 180, num_success_traj: 180, num_fail_traj: 180}
      eval: {num_expert_traj: 20, num_success_traj: 20, num_fail_traj: 20}
    PickPlaceCereal:
      expert_dir: "./data/PickPlaceCereal/expert"
      success_rollout_dir: "./data/PickPlaceCereal/success_rollout"
      fail_rollout_dir: "./data/PickPlaceCereal/fail_rollout"
      train: {num_expert_traj: 180, num_success_traj: 180, num_fail_traj: 180}
      eval: {num_expert_traj: 20, num_success_traj: 20, num_fail_traj: 20}
    PickPlaceMilk:
      expert_dir: "./data/PickPlaceMilk/expert"
      success_rollout_dir: "./data/PickPlaceMilk/success_rollout"
      fail_rollout_dir: "./data/PickPlaceMilk/fail_rollout"
      train: {num_expert_traj: 180, num_success_traj: 180, num_fail_traj: 180}
      eval: {num_expert_traj: 20, num_success_traj: 20, num_fail_traj: 20}

model:
  dice_ckpt: "./checkpoints/multitask_6/lpb_dice/lpb_dice.pt"

detector:
  device: "cuda"

support_penalty:
  weight: 0.0

visualization:
  data_source: "fail_rollout"
  fail_data_types: ["fail_rollout"]
  num_videos: 3
  fps: 20
  camera_name: "agentview"
  save_pdf: true
  num_plot_frames: 4
  flip_vertical: true
  border_thickness: 3
  banner_font_scale: 0.52
  banner_thickness: 1
  footer_font_scale: 0.40
  footer_thickness: 1

suboptimal:
  root_dir: "./data/suboptimal_dataset"
  tasks:
    - "Lift"
    - "Stack"
    - "PickPlaceCan"
    - "PickPlaceBread"
    - "PickPlaceCereal"
    - "PickPlaceMilk"
  train_count_per_task: 8
  eval_count_per_task: 2
  source_split: "all"
  seed: 42
