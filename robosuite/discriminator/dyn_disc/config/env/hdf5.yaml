# HDF5 environment for TACO representation pretraining on robosuite data.
# Override paths and dimensions via Hydra CLI or by sourcing the bash script.
name: hdf5
dataset_class: robosuite.discriminator.dyn_disc.data.HDF5DynamicsModelDataset

# HDF5 paths (file or directory containing *.hdf5).
train_data_path: ???   # required override, e.g. /abs/path/data/utils/success_rollout/PickPlaceCan
val_data_path: ${env.train_data_path}

view_names: ['agentview']

# Action / proprio dimensions (must match HDF5 contents).
action_dim: 7
proprio_dim: 9    # number of state indices used for proprio (set proprio_indices to slice raw states)

# Image dimensions.
original_img_size: 140
cropped_img_size: 128

# Embedding dims.
action_emb_dim: 256      # action_step_emb_dim (32) * frameskip (8)
proprio_emb_dim: 128

# Optional: cache fully-materialized arrays to disk for faster restarts.
use_cache: true
cache_dir: data/.lpb_score_preprocessed_cache
