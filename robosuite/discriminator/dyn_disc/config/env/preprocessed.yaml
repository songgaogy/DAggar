name: preprocessed
dataset_class: robosuite.discriminator.dyn_disc.data.PreprocessedCacheDynamicsModelDataset

# Preprocessed cache root containing <task>/*.npz
cache_root: data/.lpb_score_preprocessed_cache
metadata_cache_root: data/.lpb_score_cache
tasks: ['PandaLift', 'PandaPickPlaceCan', 'PandaStack', 'PickPlaceBread', 'PickPlaceCereal', 'PickPlaceMilk']

# Per-task trajectory caps by source type. -1 means no cap; 0 means use none.
num_expert: -1
num_success: -1
num_fail: -1

# Limit in-process episode cache to avoid OOM (per DataLoader worker).
# Set to 0 to disable caching entirely.
max_cached_episodes: 2

# Set true only when RAM is sufficient for each DataLoader worker to hold all episodes.
load_all_into_ram: false

# Legacy HDF5 path aliases (not used by `PreprocessedCacheDynamicsModelDataset`, but required
# by `lpb_original/train.py` when saving `hydra.yaml` for downstream tooling).
train_data_path: ${env.cache_root}
val_data_path: ${env.cache_root}

# Camera/view mapping (legacy LPB-score cache)
view_names: ['agentview']

# Action / proprio dimensions
action_dim: 7
proprio_dim: 14

# Image dimensions (cache is already resized)
original_img_size: 128
cropped_img_size: 128

# Embedding dims
action_emb_dim: 7
proprio_emb_dim: 32

# Kept for old CLI/config compatibility. dyn_disc requires this to stay null.
policy_ckpt_path: null

shape_obs: null
