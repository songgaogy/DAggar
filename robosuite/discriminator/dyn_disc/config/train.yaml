# TACO InfoNCE representation pretraining base configuration.
defaults:
  - _self_
  - env: hdf5
  - encoder: dinov3
  - proprio_encoder: mlp

pretraining_method: taco
run_name: taco

hydra:
  run:
    dir: ./checkpoints/dyn_disc/ablations/TACO/${run_name}-${now:%Y%m%d_%H%M%S}
  job:
    chdir: true

training:
  seed: 0
  epochs: 50
  batch_size: 256
  save_every_x_epoch: 10
  checkpoint_subdir: checkpoint
  checkpoint_epoch_offset: 1
  encoder_lr: 1e-4
  num_workers: 4
  prefetch_factor: 4
  log_every_steps: 50

img_size: ${env.original_img_size}
frameskip: 8
train_data_path: ${env.train_data_path}
val_data_path: ${env.val_data_path}
view_names: ${env.view_names}
source_view_names: ${view_names}
target_view_names: ${view_names}
abs_action: false
use_crop: true
num_hist: 1
num_pred: 1

# Panda joint qpos[7] + qvel[7] indices in flattened robosuite simulator state.
proprio:
  Stack:
    indices: [1, 2, 3, 4, 5, 6, 7, 24, 25, 26, 27, 28, 29, 30]
  NutAssemblyRound:
    indices: [1, 2, 3, 4, 5, 6, 7, 24, 25, 26, 27, 28, 29, 30]
  NutAssemblySquare:
    indices: [1, 2, 3, 4, 5, 6, 7, 24, 25, 26, 27, 28, 29, 30]
  PickPlaceBread:
    indices: [1, 2, 3, 4, 5, 6, 7, 38, 39, 40, 41, 42, 43, 44]
  PickPlaceCan:
    indices: [1, 2, 3, 4, 5, 6, 7, 38, 39, 40, 41, 42, 43, 44]
  PickPlaceCereal:
    indices: [1, 2, 3, 4, 5, 6, 7, 38, 39, 40, 41, 42, 43, 44]
  PickPlaceMilk:
    indices: [1, 2, 3, 4, 5, 6, 7, 38, 39, 40, 41, 42, 43, 44]

# Optional HDF5 dataset controls.
proprio_indices: null
proprio_map: null
max_trajectories: null
causal_action_chunks: true
return_uint8_images: true
view_frame_counts: null

proprio_emb_dim: ${env.proprio_emb_dim}

model:
  _target_: robosuite.discriminator.dyn_disc.models.taco.TACORepresentationModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  state_dim: 256
  transition_hidden: 1024
  action_step_hidden: 128
  action_step_emb_dim: 32
  encoder_micro_batch_size: 128
  random_shift_pad: 4
  use_layernorm: true
  train_encoder: false
