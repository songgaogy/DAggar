# RPT masked sensorimotor representation pretraining.
defaults:
  - _self_
  - env: hdf5
  - encoder: dinov3

pretraining_method: rpt
run_name: rpt

hydra:
  run:
    dir: ./checkpoints/dyn_disc/ablations/RPT/pretrain/${run_name}-${now:%Y%m%d_%H%M%S}
  job:
    chdir: true

training:
  seed: 0
  epochs: 50
  batch_size: 2048  # per rank; the two-GPU global batch is 4096
  peak_lr: 4.0e-4
  weight_decay: 0.01
  warmup_epochs: 8
  save_every_x_epoch: 10
  checkpoint_subdir: checkpoint
  num_workers: 4
  prefetch_factor: 4
  log_every_steps: 20

cache:
  root: checkpoints/dyn_disc/ablations/RPT/cache/dinov3_mean_v1
  version: rpt_dinov3_mean_v1
  build_batch_size: 800

context_length: 8
view_names: ${env.view_names}
max_trajectories: null

model:
  _target_: robosuite.discriminator.dyn_disc.models.rpt.RPTModel
  view_names: ${view_names}
  visual_dim: 768
  proprio_dim: ${env.proprio_dim}
  action_dim: ${env.action_dim}
  context_length: ${context_length}
  hidden_dim: 192
  depth: 4
  heads: 4
  mlp_dim: 384
  dropout: 0.0
  slot_position_embedding: learned
  mask_ratio_min: 0.7
  mask_ratio_max: 0.9

# Panda joint qpos[7] + qvel[7] in flattened robosuite simulator state.
proprio:
  Stack:
    indices: [1, 2, 3, 4, 5, 6, 7, 24, 25, 26, 27, 28, 29, 30]
  NutAssemblyRound:
    indices: [1, 2, 3, 4, 5, 6, 7, 24, 25, 26, 27, 28, 29, 30]
  NutAssemblySquare:
    indices: [1, 2, 3, 4, 5, 6, 7, 24, 25, 26, 27, 28, 29, 30]
  PickPlaceBread:
    indices: [1, 2, 3, 4, 5, 6, 7, 38, 39, 40, 41, 42, 43, 44]
  PickPlaceCan:
    indices: [1, 2, 3, 4, 5, 6, 7, 38, 39, 40, 41, 42, 43, 44]
  PickPlaceCereal:
    indices: [1, 2, 3, 4, 5, 6, 7, 38, 39, 40, 41, 42, 43, 44]
  PickPlaceMilk:
    indices: [1, 2, 3, 4, 5, 6, 7, 38, 39, 40, 41, 42, 43, 44]

proprio_map: null
