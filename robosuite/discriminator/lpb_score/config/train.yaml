hydra:
  run:
    dir: outputs/lpb_score_train/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 42

save_dir: "./checkpoints/multitask_6/lpb_score"
save_name: "lpb_score_dsm.pt"

dataset:
  window_size: 8

policy:
  ckpt: "./checkpoints/multitask_6/policy/flow-20/flow_multi_ep0100_20260320_114720.pt"
  device: "cuda"
  encoder_batch_size: 96
  trainable_encoder: false
  lora:
    enabled: false
    rank: 8
    alpha: 16.0
    dropout: 0.0

data:
  image_size: 128
  window_size: 8
  preprocessed_cache_dir: "./data/.lpb_score_preprocessed_cache"
  use_preprocessed_cache: true
  refresh_preprocessed_cache: false
  preprocessed_cache_layout: "bundle"
  upgrade_legacy_preprocessed_cache: true
  splits:
    train: {num_pos_traj: 360, num_neg_traj: 180}
    val: {num_pos_traj: 30, num_neg_traj: 15}
    test: {num_pos_traj: 10, num_neg_traj: 5}
  tasks:
    PandaLift:
      expert_dir: "./data/PandaLift/expert"
      success_rollout_dir: "./data/PandaLift/success_rollout"
      fail_rollout_dir: "./data/PandaLift/fail_rollout"
    PandaPickPlaceCan:
      expert_dir: "./data/PandaPickPlaceCan/expert"
      success_rollout_dir: "./data/PandaPickPlaceCan/success_rollout"
      fail_rollout_dir: "./data/PandaPickPlaceCan/fail_rollout"
    PandaStack:
      expert_dir: "./data/PandaStack/expert"
      success_rollout_dir: "./data/PandaStack/success_rollout"
      fail_rollout_dir: "./data/PandaStack/fail_rollout"
    PickPlaceBread:
      expert_dir: "./data/PickPlaceBread/expert"
      success_rollout_dir: "./data/PickPlaceBread/success_rollout"
      fail_rollout_dir: "./data/PickPlaceBread/fail_rollout"
    PickPlaceCereal:
      expert_dir: "./data/PickPlaceCereal/expert"
      success_rollout_dir: "./data/PickPlaceCereal/success_rollout"
      fail_rollout_dir: "./data/PickPlaceCereal/fail_rollout"
    PickPlaceMilk:
      expert_dir: "./data/PickPlaceMilk/expert"
      success_rollout_dir: "./data/PickPlaceMilk/success_rollout"
      fail_rollout_dir: "./data/PickPlaceMilk/fail_rollout"

model:
  embed_dim: 512
  num_layers: 4
  num_heads: 8
  ffn_dim: 2048
  kernel_size: 3
  dropout: 0.0
  std_clamp_min: 0.05
  noise_scale: 0.08

training:
  device: "cuda"
  batch_size: 256
  num_workers: 8
  epochs: 50
  save_freq: 5
  lr: 2e-4
  weight_decay: 1e-4
  positive_ratio: 0.5
  grad_clip_norm: 1.0
  log_every: 100
  shared_lr_multiplier: 1.0
  chunk_branch_lr_multiplier: 1.0
  encoder_branch_lr_multiplier: 1.0
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  input_pipeline: "batched_iterator"
  val_input_pipeline: "legacy_dataloader"
  batch_prefetch_depth: 2
  train_prefetch_pinned: true
  train_prefetch_thread: true
  train_batch_build_workers: 2
  cuda_prefetch: true
  batched_trajectory_cache_gb: 4
  data_in_ram: 0
  train_preload_ram_gb: 0.0
  val_preload_ram_gb: 0.0
  run_validation: false
  amp_enabled: true
  amp_dtype: "bf16"
  matmul_precision: "high"
  cudnn_benchmark: true
  # DDP runtime tuning: keep these fast-path defaults unless debugging gradients.
  ddp_find_unused_parameters: false
  ddp_static_graph: true
  ddp_gradient_as_bucket_view: true
  profile_enabled: false
  profile_log_every: 20
  profile_warmup_steps: 0
  profile_cuda_sync: true
  profile_first_step_immediate: true
  profile_norm_progress_every: 10
  # EMA shadow weights: ema <- decay * ema + (1 - decay) * online after each step.
  use_ema: false
  ema_decay: 0.999
  val_use_ema: true
  # When true with use_ema, checkpoint ``model`` is EMA; ``model_online`` holds the training weights.
  save_ema_in_checkpoint: true
