hydra:
  run:
    dir: outputs/lpb_score_visualize/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 42

save_dir: "./checkpoints/multitask_6/lpb_score/visualize"

policy:
  ckpt: "./checkpoints/multitask_6/policy/flow-20/flow_multi_ep0100_20260320_114720.pt"
  device: "cuda"
  encoder_batch_size: 96

data:
  image_size: 128
  transition_horizon: 1
  cache_dir: "./data/.lpb_score_cache"
  # If true, encode demos that lack a latent .npz (slow on first run). If false, missing
  # caches raise FileNotFoundError — typical when HDF5 mtime changed (cache keys include mtime).
  build_missing_cache: false
  encode_demo_batch_size: 8
  splits:
    train: {num_pos_traj: 360, num_neg_traj: 180}
    val: {num_pos_traj: 30, num_neg_traj: 15}
    test: {num_pos_traj: 10, num_neg_traj: 5}
  tasks:
    PandaLift:
      expert_dir: "./data/PandaLift/expert"
      success_rollout_dir: "./data/PandaLift/success_rollout"
      fail_rollout_dir: "./data/PandaLift/fail_rollout"
    PandaPickPlaceCan:
      expert_dir: "./data/PandaPickPlaceCan/expert"
      success_rollout_dir: "./data/PandaPickPlaceCan/success_rollout"
      fail_rollout_dir: "./data/PandaPickPlaceCan/fail_rollout"
    PandaStack:
      expert_dir: "./data/PandaStack/expert"
      success_rollout_dir: "./data/PandaStack/success_rollout"
      fail_rollout_dir: "./data/PandaStack/fail_rollout"
    PickPlaceBread:
      expert_dir: "./data/PickPlaceBread/expert"
      success_rollout_dir: "./data/PickPlaceBread/success_rollout"
      fail_rollout_dir: "./data/PickPlaceBread/fail_rollout"
    PickPlaceCereal:
      expert_dir: "./data/PickPlaceCereal/expert"
      success_rollout_dir: "./data/PickPlaceCereal/success_rollout"
      fail_rollout_dir: "./data/PickPlaceCereal/fail_rollout"
    PickPlaceMilk:
      expert_dir: "./data/PickPlaceMilk/expert"
      success_rollout_dir: "./data/PickPlaceMilk/success_rollout"
      fail_rollout_dir: "./data/PickPlaceMilk/fail_rollout"

model:
  dsm_ckpt: "./checkpoints/multitask_6/lpb_score/lpb_score_dsm.pt"

feature:
  device: "cuda"
  batch_size: 256
  action_horizon: -1

detector:
  device: "cuda"
  delta: 10.0
  delta_step: 0.5
  lambda_mode: "mean"
  lambda_window_size: 12
  alpha_state: 0.0
  alpha_dynamics: 0.0
  beta_state: 1.0
  beta_dynamics: 1.0

eval:
  bank_split: "train"
  bank_data_types: ["success_rollout"]
  calibration_split: "val"
  calibration_data_types: ["expert", "success_rollout"]
  fail_eval_split: "test"
  fail_eval_data_types: ["fail_rollout"]

online:
  adaptive_delta: false
  delta_min: 2.0
  delta_max: 40.0
  warmup_steps: 20
  update_interval: 5

visualization:
  bank_size: 100
  calibration_seed: 42
  data_source: "suboptimal"
  num_videos: 3
  fps: 20
  camera_name: "agentview"
  save_pdf: true
  num_plot_frames: 4
  flip_vertical: true
  border_thickness: 3
  banner_font_scale: 0.52
  banner_thickness: 1
  footer_font_scale: 0.40
  footer_thickness: 1

suboptimal:
  root_dir: "./data/suboptimal_dataset"
  tasks:
    - "Lift"
    - "Stack"
    - "PickPlaceCan"
    - "PickPlaceBread"
    - "PickPlaceCereal"
    - "PickPlaceMilk"
