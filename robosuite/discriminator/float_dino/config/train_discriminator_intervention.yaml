seed: 42

save_dir: "./checkpoints/PickPlaceCan/discriminator/float_dino"

data:
  expert_dir: "./data/PandaPickPlaceCan/expert_recover"
  fail_rollout_dir: "./data/PandaPickPlaceCan/fail_rollout"
  success_rollout_dir: ""
  camera_name: "agentview"
  max_expert_trajectories: -1
  max_fail_trajectories: -1
  max_success_trajectories: -1

split:
  val_ratio: 0.2

labels:
  fail_tail_ratio: 0.2

float:
  sinkhorn_reg: 0.05
  max_iter: 300
  tol: 1e-5
  num_expert_candidates: 50
  max_steps: -1
  use_similarity_cost: false

policy:
  type: "dino_v2"
  pretrained_path: ""
  model_name: "vit_base"
  device: "cuda"
  image_size: 518
  patch_size: 14
  num_register_tokens: 4
  latent_batch_size: 32
  normalize_embedding: true

calibration:
  delta: 10.0
  delta_step: 1.0

online:
  adaptive_delta: false
