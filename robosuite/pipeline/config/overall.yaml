defaults:
  - task: ???
  - _self_

seed: 42

environment:
  name: ${task.name}
  robots: ["Panda"]
  configuration: "default"
  controller: null
  camera_names: ["agentview", "robot0_robotview", "robot0_eye_in_hand"]
  image_height: 128
  image_width: 128
  control_frequency: 20
  horizon: ${task.horizon}
  reward_success: 1.0
  reward_failure: 0.0

inputs:
  base_policy_checkpoint: "./checkpoints/multitask_6/flow_multi_ep0100.pt"

vision:
  cache_dtype: "float16"

flow:
  action_horizon: 8
  action_dim: 7
  ode_steps: 10
  prompt_index: 0

algorithm:
  learning_rate: 3.0e-4
  batch_size: 256
  hidden_dims: [1024, 1024, 1024]
  gamma: 0.97
  tau: 0.005
  latent_action_bound: 2.0
  target_entropy: 0.0
  utd: 30
  update_interval_vector_steps: 2
  log_std_min: -20.0
  log_std_max: 2.0
  grad_clip_norm: null

warmup:
  episodes: 20
  seed: 42

runtime:
  learner_device: "cuda:0"
  inference_device: "cuda:1"
  num_envs: 4
  total_episodes: 2000
  headless: true
  viewer_enabled: false
  interactive: false
  tensor_precision: "float32"
  prefetch_batches: 2
  resume: false
  checkpoint: null

storage:
  output_root: "./outputs/baseline/dsrl"
  warmup_cache_root: "./outputs/baseline/dsrl/warmup_cache"
  run_name: null
  checkpoint_directory: "checkpoints"
  checkpoint_interval_episodes: 200
  online_replay_directory: "online_replay"
  resolved_config_filename: "config_resolved.yaml"
  metadata_filename: "run_metadata.json"
  metrics_filename: "metrics.jsonl"
  console_filename: "console.log"

tensorboard:
  enabled: true
  directory: "tensorboard"
  flush_seconds: 10

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
