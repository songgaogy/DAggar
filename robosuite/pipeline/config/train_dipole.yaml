defaults:
  - _self_

seed: 42

env:
  environment: "PickPlaceBread"
  robots: ["Panda"]
  config: "default"
  controller: null
  renderer: "mjviewer"
  render_camera: "agentview"
  camera_names: ["agentview", "robot0_robotview", "robot0_eye_in_hand"]
  proprio_keys: []
  img_height: 128
  img_width: 128
  control_freq: 20
  horizon: null

algorithm:
  type: "dipole"
  camera_names: ${env.camera_names}
  task_name: ${env.environment}

  encoder:
    encoder_type: "flow-multi"

  flow:
    action_horizon: 8
    execute_horizon: 1
    image_size: ${env.img_height}
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    grad_clip_norm: 1.0
    lambda_endpoint: 0.5
    lambda_smooth: 0.05
    n_ode_steps: 8
    device: "cuda:0"
    inference_device: "auto"
    task_prompt_map: null
    camera_aliases: {}

    augmentation:
      minimal_shift_pad: 2
      eye_in_hand_crop_scale: 0.88

    model:
      image_encoder:
        type: "shared_resnet18_spatial_softmax"
        feature_dim: 256
        pretrained_path: "/home/dodo/Documents/DAggar/robosuite/robosuite/RL/models/resnet18-f37072fd.pth"
        freeze_backbone: true
        trainable_stages: ["layer3", "layer4"]
        train_token_projections: true
        include_spatial_softmax: true
        layer3_pool_size: 2
        layer4_pool_size: 2

      proprio_encoder:
        type: "mlp"
        hidden_dim: 256
        num_tokens: 2

      language_encoder:
        type: "clip_text"
        pretrained_name: "/home/dodo/Documents/DAggar/robosuite/data/pretrained/clip-vit-base-patch32"
        max_length: 77
        freeze_backbone: true
        local_files_only: true

      modulation:
        type: "film"
        hidden_dim: 512
        modulate_visual: true
        modulate_proprio: false

      fusion:
        type: "transformer"
        feature_dim: 256
        max_language_tokens: 77
        num_heads: 8
        depth: 3
        dropout: 0.1
        use_language_adaln: false

      aggregator:
        type: "attention_pool"
        hidden_dim: 512
        output_dim: 256

      head:
        type: "unet_1d"
        hidden_dim: 128
        time_dim: 128
        cond_dim: 256
        channel_mults: [1, 2, 2, 2]
        dropout: 0.05
        cross_attention:
          enabled: true
          attn_dim: 256
          num_heads: 4
          dropout: 0.05
          mid: true
          down_layers: []
          up_layers: [0, 1]
        action_step_embedding:
          enabled: true
          embedding_dim: 64

  dipole:
    beta: 2.0
    k: 0.0
    guidance_omega: 2.0
    g_sign: "negate_raw"               # negate_raw | raw
    g_normalization: "batch_zscore"    # batch_zscore | running_zscore | minmax | none
    g_clip: 10.0
    polarity_embedding_init: "small_gaussian"   # small_gaussian | zero_neg | antipodal
    polarity_embedding_init_scale: 1.0e-3
    intervention_g: "+inf"             # manifest only; code uses an explicit mask

    lpb_detector:
      ckpt_path: "checkpoints/lpb_v2/robosuite_ckpt/bce_head.pth"   # pretrained BCE; MUST be set
      device: ${algorithm.flow.device}
      camera_to_view: {}              # {policy_camera_name: encoder_view_name}; default identity

  online_buffer:
    capacity: 200000

  demo_buffer:
    capacity: 200000

  trainer:
    batch_size: 64
    warmup_steps: 0
    updates_per_step: 1
    steps_per_update: 50
    random_steps: 0
    pretrain_steps: 0                  # DIPOLE always boots from runtime.init_checkpoint

intervention:
  enabled: true
  device: "spacemouse"
  pos_sensitivity: 1.0
  rot_sensitivity: 1.0
  reverse_xy: false
  goal_update_mode: "target"
  device_reset_as_episode_reset: true

data:
  demo_paths: []
  task_name: null
  demo_root: "./data"
  demo_split: "expert"
  num_trajectories: null

runtime:
  max_steps: 100000
  interactive: true
  viewer_enabled: true
  unthrottled: false
  viewer_backend: "auto"
  viewer_async: false
  viewer_startup_delay: 0.0
  viewer_reset_warmup_frames: 2
  visualize_gripper_markers: true
  control_fps: ${env.control_freq}
  render_fps: ${runtime.control_fps}
  image_obs_fps: ${runtime.control_fps}
  spacemouse_fps: ${runtime.control_fps}
  policy_fps: ${runtime.control_fps}
  fps_log_interval: 1.0
  async_updates: true
  online_updates_enabled: true
  eval_episode_max_steps: 300
  resume: false
  checkpoint: null
  init_checkpoint: null                # MUST be set: path to a flow-dagger / flow-multi checkpoint
  use_init_checkpoint_camera_names: true
  use_init_checkpoint_model: true
  load_buffers: true
  eval_deterministic: false
  buffer_save_interval: 200
  episode_pause_sec: 1.0

logging:
  output_root: "./outputs/DIPOLE"
  run_name: null
  project: "DIPOLE_AIR"
  entity: "songgao-personal"
  use_wandb: true
  wandb_mode: "offline"
  log_interval: 10
  checkpoint_interval: 1000

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
