# DIPOLE-RL training config (DIPOLE flow + IQL Q-chunking + frozen nnPU disc).
#
# Inherits the existing DIPOLE schema and adds three new sections:
#   - algorithm.q_learning      (IQLConfig + warmup schedule)
#   - algorithm.discriminator   (inherited frozen nnPU configuration)
#   - algorithm.advantage_g_provider  (alpha, beta)
#
# To activate the advantage-G path:
#   algorithm.dipole.g_mode: "advantage"
# To use discriminator-only G, set algorithm.dipole.g_mode=nnpu_frozen.

defaults:
  - train_dipole
  - _self_

algorithm:
  type: "dipole_rl"

  dipole:
    g_mode: "advantage"   # advantage | nnpu_frozen

  q_learning:
    enabled: true
    config:
      reward_mode: "0/1"   # "0/1" | "-1/0"
      action_horizon: ${algorithm.flow.action_horizon}
      discount: 0.99
      expectile_tau: 0.7
      q_lr: 1.0e-4
      v_lr: 1.0e-4
      target_polyak: 0.005
      n_step_aggregate: true
      # Head width AFTER the Token/Group projector (the projector — not the
      # head — is the anti-overfit lever), so smaller than the legacy 512x512.
      hidden_dims: [256, 256]
      # Token/Group dim-reduction projectors before the Q/V heads. The frozen
      # encoder feature is 16 patch-tokens; chunk_proj_dim / state_proj_dim must
      # be divisible by that token count (asserted in the learner).
      chunk_proj_dim: 128      # 14272 chunk feature -> compressed Q input
      state_proj_dim: 128      # 12288 state visual tokens -> compressed V input
      proprio_proj_dim: 32     # state proprio block -> appended to V input
      action_proj_dim: 64     # raw action chunk -> re-injected into Q
      proj_activation: "mish"  # mish | gelu | relu | silu
      q_ensemble_size: 10
      v_subset_size: 2
      grad_clip_norm: 2.0
      weight_decay: 1.0e-6
      device: "cuda:1"
      output_reward_coef: 1
      disc_reward_coef: 0
      update_freq: 1
    warmup_value_steps: 10000
    warmup_full_steps: 5000
    warmup_ckpt: null

  discriminator:
    learner_device: ${algorithm.q_learning.config.device}

  advantage_g_provider:
    alpha: 1.0
    beta: 0

# Used only by ``python -m ...q_learning.warmup`` (init_iql_qv.sh).
warmup:
  # Pre-encode every valid chunk once and sample from cached latents during the
  # warmup loops (frozen encoder => results-neutral; pure speedup). Set false to
  # re-encode every step (old behavior).
  preencode_cache: true
  preencode_batch_size: 32
  # Where to hold the full pre-encoded chunk cache. "cpu" is the safe default:
  # the cache holds one encoded-feature row per valid chunk (q_chunk_feature
  # alone is ~14k floats), so on a 100k+ chunk dataset "learner"/"device" (cache
  # on the IQL GPU) accumulates tens of GB of VRAM during preencode and OOMs.
  # CPU cache costs only a per-step batch H2D copy in the warmup loops.
  preencode_cache_device: "cpu"        # "cpu" | "learner"/"device" (cache on the IQL GPU; OOM risk)
  # Collapse each success demo's post-success drift into one frozen absorbing
  # anchor: every frame strictly after the first success frame is overwritten
  # with a copy of that first-success frame (obs images + proprio + action), so
  # all post-success chunks encode to one identical (s, a) latent. Keeps the
  # terminal-anchor sampling density (still valid chunk starts) but drops the
  # burden/bias of fitting Q/V on many distinct meaningless drift states.
  # No-op for demos without a success frame (e.g. fail_rollout truncations).
  freeze_post_success: true
  demo_splits:
    - expert
    - success_rollout
    - fail_rollout-labeled
  # Max HDF5 trajectories per split (null = all demos in that folder).
  num_trajectories:
    expert: 0
    success_rollout: 50
    fail_rollout: 50
    fail_rollout-labeled: 50
    save_data: true           # save the iql training data for future use
    save_dir: "offline_data"  # <data_root>/<task_name>/<save_dir>

runtime:
  init_checkpoint: null               # MUST be set: flow-dagger base ckpt.
  bootstrap_g_with_frozen_nnpu: true  # During warmup, use discriminator-only G.
