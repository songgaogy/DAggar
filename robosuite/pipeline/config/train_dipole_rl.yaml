# DIPOLE-RL training config (DIPOLE flow + VAST value stitching + frozen nnPU disc).
#
# Inherits the existing DIPOLE schema and adds three new sections:
#   - algorithm.vast            (VASTConfig + warmup schedule)
#   - algorithm.discriminator   (inherited frozen nnPU configuration)
#   - algorithm.advantage_g_provider  (alpha, beta)
#
# To activate the advantage-G path:
#   algorithm.dipole.g_mode: "advantage"
# To use discriminator-only G, set algorithm.dipole.g_mode=nnpu_frozen.

defaults:
  - train_dipole
  - _self_

algorithm:
  type: "dipole_rl"

  dipole:
    g_mode: "advantage"   # advantage | nnpu_frozen

  vast:
    enabled: true
    config:
      vast_v_mode: "single_vast"  # single_vast | indep_ensemble
      vast_max_k: 10               # macro chunks; one chunk is action_horizon steps
      vast_comp_coef: 0.5
      vast_sampling_seed: ${seed}
      reward_mode: "-1/0"   # "0/1" | "-1/0"
      action_horizon: ${algorithm.flow.action_horizon}
      discount: 0.99
      expectile_tau: 0.9
      # The ensemble size is used only when vast_v_mode=indep_ensemble.
      v_ensemble_size: 5
      g_lr: 1.0e-4
      v_lr: 1.0e-4
      target_polyak: 0.005
      n_step_aggregate: true
      # Head width AFTER the Token/Group projector (the projector — not the
      # head — is the anti-overfit lever), so smaller than the legacy 512x512.
      hidden_dims: [512, 512, 256]
      # Token/Group dim-reduction projector before the V head. The frozen
      # encoder state feature is 16 patch-tokens; state_proj_dim must be
      # divisible by that token count (asserted in the learner).
      state_proj_dim: 128      # 12288 state visual tokens -> compressed V input
      proprio_proj_dim: 32     # state proprio block -> appended to V input
      proj_activation: "mish"  # mish | gelu | relu | silu
      grad_clip_norm: 2.0
      weight_decay: 2.0e-6
      device: "cuda:1"
      output_reward_coef: 1
      disc_reward_coef: 0.1
      update_freq: 1
    # Preserve the previous total warmup budget as one joint G+V schedule.
    warmup_joint_steps: 20000
    warmup_ckpt: null

  discriminator:
    learner_device: ${algorithm.vast.config.device}

  advantage_g_provider:
    alpha: 1.0
    beta: 0

# Used only by ``python -m ...algorithms.vast.warmup`` (init_vast.sh).
warmup:
  # Raw-HDF5 load acceleration. Rollout HDF5 stores pre-action `is_success`;
  # warmup shifts it by one step to match post-action env success rewards and
  # falls back to MuJoCo replay only for demos without the label.
  prefer_hdf5_success_labels: true
  # Read each selected demo/camera image array in one HDF5 call instead of
  # per-frame dataset indexing. This keeps raw-HDF5 semantics but reduces gzip
  # chunk access overhead.
  bulk_read_hdf5_images: true
  # Pre-encode every valid chunk once and sample from cached latents during the
  # warmup loops (frozen encoder => results-neutral; pure speedup). Set false to
  # re-encode every step (old behavior).
  preencode_cache: true
  preencode_batch_size: 32
  preencode_cache_device: "learner"    # "cpu" | "learner"/"device" (cache on the VAST GPU; OOM risk)
  freeze_post_success: true
  demo_splits:
    - expert
    - success_rollout
    - fail_rollout-labeled
  # Max HDF5 trajectories per split (null = all demos in that folder).
  num_trajectories:
    expert: 0
    success_rollout: 50
    fail_rollout: 50
    fail_rollout-labeled: 50
    save_data: true           # save the VAST training data for future use
    save_dir: "offline_data-vast"  # <data_root>/<task_name>/<save_dir>

runtime:
  init_checkpoint: null               # MUST be set: flow-dagger base ckpt.
  bootstrap_g_with_frozen_nnpu: true  # During warmup, use discriminator-only G.
