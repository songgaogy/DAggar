# Offline DIPOLE training (README step-4).
# Inherits the full DIPOLE-RL stack (env / flow / dipole / VAST /
# adv / discriminator) from train_dipole_rl and overrides the
# pieces that differ for the offline, rollout-free setting.
defaults:
  - train_dipole_rl
  - _self_

# Offline-specific knobs (read by offline/src/train_offline_dipole.py).
offline:
  data_root: "/home/dodo/Documents/DAggar/robosuite/data"
  pretrain_dir: "pretrain_data-20260615_174814"   # <data_root>/<task>/<pretrain_dir>, expert HDF5, all frames
  offline_data_dir: "offline_data"                 # <data_root>/<task>/<offline_data_dir>/vast_offline_transitions.pt
  num_train_steps: 15000
  run_subfix: ""                                   # run dir = "<timestamp>" or "<timestamp>_<run_subfix>"
  log_interval: 200
  plot_log_interval: null              # null => same as log_interval
  checkpoint_interval: 5000
  preencode_batch_size: 64
  max_pretrain_trajectories: null                  # null = all expert demos
  mode: "normal"                                    # "naive" or "normal" or "neg_all"
  eval:                                            # consumed by offline/scripts/eval_offline_dipole.sh
    omega: 0.2
    episodes: 50
    episode_max_steps: 500
    save_video: true

env:
  environment: "PickPlaceCereal"

algorithm:
  type: "dipole_rl"              # reuse the DipoleAgent builder (factory has no separate offline type)
  online_buffer:
    capacity: 5000000            # offline data is static; never wrap (would break the precompute index map)
  dipole:
    g_mode: "advantage"          # offline uses the TD-advantage provider
  vast:
    enabled: true
    warmup_ckpt: null            # set via VAST_CKPT / algorithm.vast.warmup_ckpt
    config:
      device: "cuda:0"           # single-GPU offline default
  discriminator:
    checkpoint: null             # set via NNPU_CKPT / algorithm.discriminator.checkpoint
    learner_device: "cuda:0"
    inference:
      device: "cuda:0"
      intervene_env: false
    hud:
      enabled: false
  flow:
    device: "cuda:0"
    inference_device: "cuda:0"

runtime:
  interactive: false
  viewer_enabled: false
  online_updates_enabled: false
  init_checkpoint: null          # set via INIT_CHECKPOINT / POLICY_CKPT (pretrained flow policy)

logging:
  output_root: "./outputs/dipole_offline"
  run_subfix: null
  use_tensorboard: true
  tensorboard_dir: "tensorboard/policy"
