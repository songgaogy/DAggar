# Standalone warm-start finetuning for the frozen-encoder nnPU discriminator.
# This config is intentionally independent from train_offline_dipole.yaml.
seed: 0

env:
  environment: "PickPlaceCereal"

algorithm:
  discriminator:
    checkpoint: null  # Required: calibrated parent nnPU head for warm-start.
    encoder_ckpt: null
    learner_device: "cuda:0"
    camera_to_view: {}

offline:
  discriminator_finetune:
    episodes_path: "data/${env.environment}/offline_data/offline_episodes.pt"
    pretrain_dir: "data/${env.environment}/discriminator-pretrain"
    epochs: 10
    lr: 3.0e-5
    weight_decay: 1.0e-4
    encode_batch_size: 32
    log_interval: 10
    run_root: "./outputs/discriminator-finetune"
    run_subfix: ""

    gt_negative:
      pre_intervention_chunks: 1
      post_intervention_chunks: 1
      pre_end_chunk: 0
      action_source: "policy_action"
      post_boundary: "intervention_block"
      chunk_boundary: "continuous_window"

    objective:
      # null derives the epoch length from the pretrain replay pool sizes.
      # L = lambda_pre * L_pre_nnpu
      #   + lambda_P * (L_P_BCE + mu * L_P_safe) + lambda_N * L_N.
      steps_per_epoch: null
      terms:
        nnpu_replay:
          type: "nnpu"
          enabled: true
          weight: 1.0
          batch_size: 512
          positive_fraction: 0.5

        gt_positive:
          type: "positive_safety_margin"
          enabled: true
          weight: 0.025
          batch_size: 256
          safety_margin_weight: 1.0
          margin_delta: 1.0
          temperature: 1.0
          boundary_source: "parent_checkpoint"

        gt_negative:
          type: "negative_logistic"
          enabled: true
          weight: 0.0125
          batch_size: 256

logging:
  use_tensorboard: true
  tensorboard_dir: "tensorboard"
  use_wandb: false
