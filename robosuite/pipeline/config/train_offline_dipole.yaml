# Offline DIPOLE (sequential IQL-finetune -> weighted-BC) — PROMPT.md [tbd].
# Consumes data/<task>/offline_data/offline_episodes.pt (collect_data.sh) and the
# warmup IQL state (init_iql_qv.sh). Inherits the full RL stack from train_dipole_rl.
defaults:
  - train_dipole_rl
  - _self_

offline:
  data_root: "/home/dodo/Documents/DAggar/robosuite_dipole-rl_v3/data"
  # Collected episodes; null -> data/<task>/offline_data/offline_episodes.pt.
  episodes_path: null
  # Expert pretrain HDF5 dir/file; null -> do not add pretrain data to Phase B.
  pretrain_data_path: null
  max_pretrain_trajectories: null
  # Warmup transitions dir under data/<task>/ (init_iql_qv save_dir).
  iql_warmup_transitions_dir: "offline_data-iql"
  # Add entire pure on-policy success rollouts (terminal_reason==success AND zero
  # human intervention) as positive BC demos. Offline DAgger appends them; main
  # Offline DIPOLE replaces their advantage route with pos_only (w_pos=1).
  use_online_success: false

  # Per-frame section-outcome rewards for policy sections (config-overridable).
  reward_success: 0.0
  reward_fail: -1.0
  # policy_action during intervention -> negative branch (default on).
  include_policy_action_neg: true

  # Phase B policy-update budget.
  num_train_steps: 15000
  log_interval: 200
  plot_log_interval: null
  checkpoint_interval: 5000
  preencode_batch_size: 64

  # Result saving: ./outputs/dipole-rl-offline/<task>_<timestamp>_<postfix>.
  run_root: "./outputs/dipole-rl-offline"
  run_subfix: ""

  # Phase A IQL finetune (unfrozen, continues from warmup_ckpt).
  skip_rl: false
  iql_finetuned_path: null
  iql_finetune:
    num_steps: 20000
    value_only_steps: 0
    batch_size: 256
    preencode_cache: true

  # Phase-B advantage read-out fed into G (offline/utils/advantage.py).
  advantage:
    # gae -> GAE(gae_lambda) accumulated backward per policy-section episode on
    #        the soft-LCB value (matches q_learning/utils/vis_qv.py read-out).
    # td1 -> the plain 1-step (macro-step) TD residual.
    estimator: "gae"          # gae | td1
    gae_lambda: 0.6

  # Pluggable branch-weight policy (offline/utils/branch_weights.py).
  branch_weight:
    type: "routed_sigmoid"    # routed_sigmoid | disc_scaled
    # w_pos = sigmoid(beta * (G + k)). NOTE: G is NOT normalized, so beta is the
    # post-offset slope (tracks advantage scale). k shifts the decision threshold
    # in G-space (w_pos=0.5 at G=-k). GAE(lambda=0.6) advantages run ~2x the
    # 1-step residual, so beta~2.0 here vs ~4.0 for estimator=td1. Tune against
    # the branch-weight histogram (diagnostic_plots.py) so w_pos does not
    # collapse to {0,1}.
    beta: 1.0
    k: -2.0

algorithm:
  type: "dipole_rl"
  online_buffer:
    # Static, never-wrap buffer so precompute start indices stay valid.
    capacity: 5000000
  dipole:
    g_mode: "advantage"
    beta: 2.0        # overridden at runtime by offline.branch_weight.beta; kept in sync
    k: 0.0
  q_learning:
    enabled: true
    warmup_ckpt: null
    config:
      device: "cuda:0"
  discriminator:
    checkpoint: null
    learner_device: "cuda:0"
    inference:
      device: "cuda:0"
      intervene_env: false
    hud:
      enabled: false
  flow:
    device: "cuda:0"
    inference_device: "cuda:0"
  # Pure TD advantage into G: G = alpha*A - beta*failure (beta=0 -> no disc mix).
  advantage_g_provider:
    alpha: 1.0
    beta: 0.0

runtime:
  interactive: false
  viewer_enabled: false
  online_updates_enabled: false
  init_checkpoint: null

logging:
  use_tensorboard: true
  tensorboard_dir: "tensorboard"
