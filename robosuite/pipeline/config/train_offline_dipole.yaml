# Offline DIPOLE with frozen-discriminator branch weighting.
defaults:
  - train_dipole
  - _self_

env:
  environment: "PickPlaceCereal"

offline:
  data_root: "/home/dodo/Documents/DAggar/robosuite/data"
  # Collected episodes; null -> data/<task>/offline_data/offline_episodes.pt.
  episodes_path: null
  # Expert pretrain HDF5 dir/file; null -> do not add pretrain data.
  pretrain_data_path: null
  max_pretrain_trajectories: null
  # Shared HDF5 loading uses sparse rewards in the existing Offline DAgger mode.
  reward_mode: "-1/0"
  # Add pure on-policy success rollouts as positive BC demonstrations.
  use_online_success: false
  # policy_action during intervention -> negative branch (default on).
  include_policy_action_neg: true

  num_train_steps: 15000
  log_interval: 500
  plot_log_interval: null
  checkpoint_interval: 5000
  preencode_batch_size: 64

  # Result saving: <discriminator_run_parent>/dipole.
  run_root: "./outputs/dipole-rl-offline_disc"
  run_subfix: ""
  run_dir: null

  # s = raw failure score; G = threshold - s; w_pos = sigmoid(beta * G).
  branch_weight:
    beta: 2.0

algorithm:
  online_buffer:
    # Static, never-wrap buffer so cached start indices remain valid.
    capacity: 5000000
  dipole:
    g_mode: "nnpu_frozen"
    beta: ${offline.branch_weight.beta}
  discriminator:
    checkpoint: null
    learner_device: "cuda:0"
    inference:
      device: "cuda:0"
      intervene_env: false
    hud:
      enabled: false
  flow:
    device: "cuda:0"
    inference_device: "cuda:0"

runtime:
  interactive: false
  viewer_enabled: false
  online_updates_enabled: false
  init_checkpoint: null

logging:
  use_tensorboard: true
  tensorboard_dir: "tensorboard/dipole"
