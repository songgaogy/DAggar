# @package _global_
# Shared frozen nnPU runtime and standalone offline-finetune configuration.

seed: 0

env:
  environment: "PickPlaceCereal"

algorithm:
  discriminator:
    # feature_source and transformer_layer are immutable checkpoint properties.
    enabled: true
    task_name: ${env.environment}
    checkpoint: null                  # runtime override or explicit finetune parent
    encoder_ckpt: null                # optional dynamics-encoder path override
    learner_device: ${oc.select:algorithm.flow.device,cuda:0}
    camera_to_view: {}                # map policy camera name -> encoder view name
    inference:
      device: "cuda:0"
      # -1 (default): chunk-triggered — score once per new policy action chunk.
      #  >0: legacy fixed-rate — score at this many frames/sec, decoupled from chunks.
      fps: -1
      intervene_env: true             # pause the env on a sustained "fail" prediction
    pause:
      consecutive_fail_frames: 2      # consecutive scored "fail" frames before pausing
      require_safe_to_rearm: true     # after resume, re-pause only after a "safe" frame
    hud:
      enabled: true                   # single-line in-place console status bar

offline:
  discriminator_finetune:
    # Used only when algorithm.discriminator.checkpoint is null.
    parent_checkpoint: "checkpoints/dyn_disc/pu_bce_eval_robosuite-chunk_v2/run_20260717_121451_PickPlaceCereal/checkpoints/pu_bce_head.pth"
    episodes_path: "data/${env.environment}/offline_data/offline_episodes.pt"
    pretrain_dir: "data/${env.environment}/discriminator-pretrain-quadratic-c2-l1e2-v2"
    epochs: 20
    scheduler_horizon_epochs: 20
    lr: 1.0e-5
    weight_decay: 1.0e-4
    encode_batch_size: 32
    log_interval: 10
    run_root: "./outputs/dipole-rl-offline_vast"
    run_subfix: ""
    # Explicit discriminator stage directory. null creates
    # <run_root>/<task>_<timestamp>[_suffix]/discriminator.
    run_dir: null

    gt_negative:
      pre_intervention_chunks: 1
      post_intervention_chunks: 1
      pre_end_chunk: 0
      action_source: "policy_action"
      post_boundary: "intervention_block"
      chunk_boundary: "continuous_window"

    objective:
      steps_per_epoch: null

      logit_normalization:
        enabled: true
        method: "fixed_robust_iqr"

      quadratic_logit_cap:
        enabled: true
        scope: "all_terms"
        cap: 2.0
        weight: 1.0e-2

      terms:
        nnpu_replay:
          type: "nnpu"
          enabled: true
          weight: 0.1
          batch_size: 256
          positive_fraction: 0.5
        gt_positive:
          type: "positive_logistic"
          enabled: true
          weight: 0.2
          batch_size: 128
        gt_negative:
          type: "negative_logistic"
          enabled: true
          weight: 0.01
          batch_size: 128

logging:
  use_tensorboard: true
  tensorboard_dir: "tensorboard/disc"
  use_wandb: false
