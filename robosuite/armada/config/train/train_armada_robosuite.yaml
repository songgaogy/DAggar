defaults:
  - _self_
  - task: robosuite_lift_image

name: train_armada_robosuite
_target_: diffusion_policy.diffusion_policy.workspace.train_armada_robosuite_workspace.TrainArmadaRobosuiteWorkspace

task_name: ${.task.name}
shape_meta: ${.task.shape_meta}
mode: train

#########################################################
# CHANGE ME!
exp_name: "default"
dataset_path: "/home/dodo/Documents/DAggar/robosuite/robosuite/armada/data/tmp/lift_image/replay_buffer.zarr"   # end with .zarr
debug: True
device_ids: "0,1"
batch_size: 16
grad_accu: 4
#########################################################

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${.n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_cond: True

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_hybrid_dinov2_policy.DiffusionTransformerHybridDinov2Policy

  shape_meta: ${..shape_meta}
  
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    # beta_schedule is important according to ARMADA, this is the config from prev_work
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon  # or sample

  obs_encoder:
    _target_: diffusion_policy.model.hybrid.dinov2_obs_encoder.Dinov2ObsEncoder
    img_size: 518
    patch_size: 14
    init_values: 1.0
    ffn_layer: mlp
    block_chunks: 0
    num_register_tokens: 4
    interpolate_antialias: True
    interpolate_offset: 0.0
    proprio_shape: ${...shape_meta.obs.ee_pose.shape}
    # pretrained_path: /home/yuwenye/common/dinov2/dinov2_vitb14_reg4_pretrain.pth
    pretrained_path: null

  horizon: ${..horizon}
  n_action_steps: ${eval:'${..n_action_steps}+${..n_latency_steps}'}
  n_obs_steps: ${..n_obs_steps}
  num_inference_steps: 20

  n_layer: 8
  n_cond_layers: 0  # >0 to use transformer encoder for cond, otherwise mlp
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: True
  time_as_cond: True
  obs_as_cond: ${..obs_as_cond}
  crop_shape: [224, 224] 

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: ${batch_size}
  num_workers: 2
  # shuffle: True
  pin_memory: False
  persistent_workers: True
  prefetch_factor: 4
  drop_last: False

val_dataloader:
  batch_size: ${batch_size}
  num_workers: 2
  # shuffle: True
  pin_memory: True
  persistent_workers: True
  prefetch_factor: 4
  drop_last: False

optimizer:
  _target_: torch.optim.AdamW
  learning_rate: 1.0e-4
  betas: [0.9, 0.95]
  transformer_weight_decay: 1.0e-3
  obs_encoder_weight_decay: 1.0e-6

training:
  device: ${device_ids}
  seed: 42
  debug: ${debug}
  resume: False
  resume_path: /path/to/resume/checkpoint
  lr_scheduler: cosine
  # Transformer needs LR warmup
  lr_warmup_steps: 500
  num_epochs: 500
  gradient_accumulate_every: ${grad_accu}
  # (ARMADA): EMA destroys performance when used with BatchNorm; replace BatchNorm with GroupNorm.
  use_ema: True
  # training loop control in epochs
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: armada_robosuite-${task.name}
  mode: offline
  name: ${now:%Y.%m.%d}-${now:%H.%M.%S}_${name}_${task_name}
  id: null
  group: null
  tags: ["robosuite", "armada", "dinov2"]

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${..name}_${..task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${..name}_${..task_name}

hydra:
  job:
    override_dirname: ${...name}
  run:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${...name}_${...task_name}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${...name}_${...task_name}
    subdir: ${hydra.job.num}
