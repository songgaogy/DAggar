hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - policy_checkpoint=/home/dodo/Documents/DAggar/robosuite/lpb_robosuite/data/outputs/2026.03.06/13.42.42_train_diffusion_unet_hybrid_pandalift_image/checkpoints
    - dynamics_model_checkpoint=/home/dodo/Documents/DAggar/robosuite/lpb_robosuite/data/outputs/2026.03.06/15.28.37_pandalift/checkpoints
    - demo_dataset_path=/home/dodo/Documents/DAggar/robosuite/data/PandaLift/expert
    - dataset_path=/home/dodo/Documents/DAggar/robosuite/data/PandaLift/expert
    - output_dir=/home/dodo/Documents/DAggar/robosuite/lpb_robosuite/data/release_pandalift_test
  job:
    name: eval_test_time_optimization
    chdir: null
    override_dirname: dataset_path=/home/dodo/Documents/DAggar/robosuite/data/PandaLift/expert,demo_dataset_path=/home/dodo/Documents/DAggar/robosuite/data/PandaLift/expert,dynamics_model_checkpoint=/home/dodo/Documents/DAggar/robosuite/lpb_robosuite/data/outputs/2026.03.06/15.28.37_pandalift/checkpoints,output_dir=/home/dodo/Documents/DAggar/robosuite/lpb_robosuite/data/release_pandalift_test,policy_checkpoint=/home/dodo/Documents/DAggar/robosuite/lpb_robosuite/data/outputs/2026.03.06/13.42.42_train_diffusion_unet_hybrid_pandalift_image/checkpoints
    id: ???
    num: ???
    config_name: eval_pandalift
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/dodo/Documents/DAggar/robosuite/lpb_robosuite
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/dodo/Documents/DAggar/robosuite/lpb_robosuite/dyn_model/conf/planner
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/dodo/Documents/DAggar/robosuite/lpb_robosuite
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
