name: lpb

dependencies:
  # --- core runtime (keep constrained) ---
  - python=3.9
  - pip>=22.2,<24

  # --- cuda + torch stack (pin tightly as a compatible set) ---
  - cudatoolkit=11.6
  - pytorch=1.12.1
  - torchvision=0.13.1
  - pytorch3d=0.7.0

  # --- numeric stack (relax to minor range) ---
  - numpy>=1.23,<1.24
  - numba>=0.56,<0.57
  - scipy>=1.9,<1.10

  # --- common utils (relax) ---
  - py-opencv>=4.6,<4.9
  - cffi>=1.15,<2
  - ipykernel>=6.16,<7
  - matplotlib>=3.6,<3.8
  - tqdm>=4.64,<5
  - dill>=0.3.5,<0.4
  - click>=8.0,<9
  - psutil>=5.9,<6
  - termcolor>=2.0,<3
  - threadpoolctl>=3.1,<4

  # --- io / datasets (relax) ---
  - h5py>=3.7,<4
  - zarr>=2.12,<3
  - numcodecs>=0.10,<0.13
  - imageio>=2.22,<3
  - imageio-ffmpeg>=0.4.7,<0.5
  - scikit-image>=0.19,<0.21
  - scikit-video>=1.1.11,<1.2
  - shapely>=1.8,<2
  - cython>=0.29,<3

  # --- config / logging (relax) ---
  - hydra-core>=1.2,<1.4
  - einops>=0.4,<0.8
  - wandb>=0.13,<0.17
  - tensorboard>=2.10,<2.15
  - tensorboardx>=2.5,<2.7
  - boto3>=1.24,<2
  - accelerate>=0.13,<0.23
  - datasets>=2.6,<2.15

  # --- video codec (keep stable, choose ONE source: conda OR pip; prefer pip below) ---
  - av>=10,<12
  - cmake>=3.24,<4

  # trick to avoid cpu affinity issue described in https://github.com/pytorch/pytorch/issues/99625
  - llvm-openmp=14

  - pip:
      # RL/robotics stack (pin important ones)
      - ray[default,tune]==2.2.0
      - free-mujoco-py==2.1.6
      - dm-control==1.0.9
      - gym==0.21.0
      - pygame>=2.1,<2.6
      - pybullet-svl==3.1.6.4

      # task envs / datasets (pin to avoid API breakage)
      - robosuite==1.4.1
      - robomimic==0.3.0

      # diffusion / vision libs (relax modestly; can pin if your code is fragile)
      - diffusers>=0.11,<0.20
      - pytorchvideo==0.1.5

      # keep only ONE imagecodecs entry, and only in pip (avoid conda/pip mismatch)
      - imagecodecs==2022.9.26

      # exact commit dependency
      - r3m @ https://github.com/facebookresearch/r3m/archive/b2334e726887fa0206962d7984c69c5fb09cceab.tar.gz