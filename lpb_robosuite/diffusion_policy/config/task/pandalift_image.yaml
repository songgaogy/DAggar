name: pandalift_image

shape_meta: &shape_meta
  obs:
    agentview_image:
      shape: [3, 256, 256]
      type: rgb
    robot0_joint_qpos:
      shape: [7]
    robot0_jointvel_qpos:
      shape: [7]
  action:
    shape: [7]

task_name: &task_name pandalift
dataset_type: &dataset_type expert
dataset_path: &dataset_path data/PandaLift/expert
abs_action: &abs_action False

env_runner:
  _target_: diffusion_policy.env_runner.noop_image_runner.NoopImageRunner

dataset:
  _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
  shape_meta: *shape_meta
  dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  abs_action: *abs_action
  rotation_rep: 'rotation_6d'
  use_legacy_normalizer: False
  use_cache: True
  seed: 42
  val_ratio: 0.02
