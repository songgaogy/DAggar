hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - policy_checkpoint=/home/dodo/Documents/DAggar/robosuite/lpb/data/outputs/2026.03.09/11.53.10_train_diffusion_unet_hybrid_transport_image/checkpoints/20.ckpt
    - dynamics_model_checkpoint=/home/dodo/Documents/DAggar/robosuite/lpb/data/outputs/2026.03.12/11.02.54_transport/checkpoints/model_200.pth
    - demo_dataset_path=/home/dodo/Documents/DAggar/robosuite/data/lpb/transport/transport_rollout_and_demo.hdf5
    - ++dataset_path=/home/dodo/Documents/DAggar/robosuite/data/lpb/transport/transport_rollout_and_demo.hdf5
    - n_test=50
    - n_test_vis=1
    - test_start_seed=100000
    - n_action_steps=15
    - guidance_start_timestep=10
    - guidance_scale=0.2
    - threshold=2.8
    - demo_batch_size=32
    - demo_loader_workers=8
    - demo_subsample_stride=1
    - demo_max_samples=null
    - nn_chunk_size=1024
    - output_dir=/home/dodo/Documents/DAggar/robosuite/lpb/data/eval/lpb_transport/2026.03.13_01.54.36
    - device=cuda:0
  job:
    name: eval_test_time_optimization
    chdir: null
    override_dirname: ++dataset_path=/home/dodo/Documents/DAggar/robosuite/data/lpb/transport/transport_rollout_and_demo.hdf5,demo_batch_size=32,demo_dataset_path=/home/dodo/Documents/DAggar/robosuite/data/lpb/transport/transport_rollout_and_demo.hdf5,demo_loader_workers=8,demo_max_samples=null,demo_subsample_stride=1,device=cuda:0,dynamics_model_checkpoint=/home/dodo/Documents/DAggar/robosuite/lpb/data/outputs/2026.03.12/11.02.54_transport/checkpoints/model_200.pth,guidance_scale=0.2,guidance_start_timestep=10,n_action_steps=15,n_test=50,n_test_vis=1,nn_chunk_size=1024,output_dir=/home/dodo/Documents/DAggar/robosuite/lpb/data/eval/lpb_transport/2026.03.13_01.54.36,policy_checkpoint=/home/dodo/Documents/DAggar/robosuite/lpb/data/outputs/2026.03.09/11.53.10_train_diffusion_unet_hybrid_transport_image/checkpoints/20.ckpt,test_start_seed=100000,threshold=2.8
    id: ???
    num: ???
    config_name: eval_transport
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home/dodo/Documents/DAggar/robosuite/lpb
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/dodo/Documents/DAggar/robosuite/lpb/dyn_model/conf/planner
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/dodo/Documents/DAggar/robosuite/lpb
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
